__version__: 2.0.8
transform:
  __class_fullname__: Compose
  additional_targets: {}
  bbox_params: null
  is_check_shapes: true
  keypoint_params: null
  p: 1.0
  transforms:
  - __class_fullname__: Affine
    balanced_scale: false
    border_mode: 0
    fill:
    - 0.0
    - 0.0
    - 0.0
    fill_mask: 0.0
    fit_output: false
    interpolation: 1
    keep_ratio: false
    mask_interpolation: 0
    p: 0.6
    rotate:
    - -10.0
    - 10.0
    rotate_method: largest_box
    scale:
      x:
      - 0.85
      - 1.08
      y:
      - 0.85
      - 1.08
    shear:
      x:
      - -6.0
      - 6.0
      y:
      - -6.0
      - 6.0
    translate_percent:
      x:
      - -0.02
      - 0.02
      y:
      - -0.02
      - 0.02
    translate_px: null
  - __class_fullname__: Perspective
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    fit_output: false
    interpolation: 1
    keep_size: true
    mask_interpolation: 0
    p: 0.25
    scale:
    - 0.02
    - 0.06
  - __class_fullname__: RandomBrightnessContrast
    brightness_by_max: true
    brightness_limit:
    - -0.25
    - 0.25
    contrast_limit:
    - -0.25
    - 0.25
    ensure_safe_range: false
    p: 0.5
  - __class_fullname__: Downscale
    interpolation_pair:
      downscale: 3
      upscale: 1
    p: 0.5
    scale_range:
    - 0.25
    - 0.6
  - __class_fullname__: OneOf
    p: 0.35
    transforms:
    - __class_fullname__: MotionBlur
      allow_shifted: true
      angle_range:
      - 0.0
      - 360.0
      blur_limit:
      - 3
      - 7
      direction_range:
      - -1.0
      - 1.0
      p: 1.0
    - __class_fullname__: GaussianBlur
      blur_limit:
      - 0
      - 0
      p: 1.0
      sigma_limit:
      - 0.3
      - 1.2
  - __class_fullname__: ImageCompression
    compression_type: jpeg
    p: 0.4
    quality_range:
    - 30
    - 90
  - __class_fullname__: GaussNoise
    mean_range:
    - 0.0
    - 0.0
    noise_scale_factor: 1.0
    p: 0.2
    per_channel: true
    std_range:
    - 0.02
    - 0.08
  - __class_fullname__: OneOf
    p: 0.15
    transforms:
    - __class_fullname__: CoarseDropout
      fill: 0.0
      fill_mask: null
      hole_height_range:
      - 1
      - 5
      hole_width_range:
      - 1
      - 5
      num_holes_range:
      - 1
      - 6
      p: 1.0
    - __class_fullname__: PixelDropout
      drop_value: 0.0
      dropout_prob: 0.02
      mask_drop_value: null
      p: 1.0
      per_channel: false
